version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: life-system-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/lifesystem.db
      - ALLOWED_ORIGINS=https://yourdomain.com,http://localhost:8000
